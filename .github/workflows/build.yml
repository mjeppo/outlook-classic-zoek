name: Build portable exe

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [ win-x64, win-x86 ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

            - name: Publish self-contained
        run: >
          dotnet publish OutlookClassicSearch.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:DebugType=none

      - uses: actions/upload-artifact@v4
        with:
          name: OutlookClassicSearch-portable-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/
          retention-days: 30
